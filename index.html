<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e0f12"><meta http-equiv="Cache-Control" content="no-store"><title>Cup — Locked</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e0f12;color:#f6f7f9;font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(420px,100%);background:#17191f;border:1px solid #30343d;border-radius:20px;padding:22px}h1{margin:0 0 4px;font-size:30px}p{color:#aeb4bf}input,button{width:100%;font:inherit;border-radius:12px;padding:13px;margin-top:10px}input{background:#0c0d10;color:white;border:1px solid #3a3f49}button{border:0;background:#ff9f43;color:#1b1107;font-weight:800}.status{min-height:24px;margin-top:10px;color:#ff9f43;font-size:14px}.privacy{font-size:12px;color:#8f96a3;margin-top:16px}</style></head><body><main class="box"><h1>Cup</h1><p>Private measurement app. Enter the password to unlock it on this device.</p><form id="f"><input id="p" type="password" autocomplete="current-password" placeholder="Password" autofocus><button>Unlock Cup</button></form><div class="status" id="s"></div><div class="privacy">The decrypted app exists only in this browser session. Photos are not uploaded by Cup.</div></main><script>
const $=id=>document.getElementById(id);function b64(s){const x=atob(s),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}
$('f').addEventListener('submit',async e=>{e.preventDefault();$('s').textContent='Unlocking…';try{const r=await fetch('./cup.enc',{cache:'no-store'});if(!r.ok)throw Error('Encrypted app unavailable');const j=await r.json();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode($('p').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(j.salt),iterations:j.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(j.iv)},key,b64(j.ciphertext));const html=new TextDecoder().decode(plain);document.open();document.write(html);document.close()}catch(err){$('s').textContent='Wrong password or the encrypted app could not be opened.';$('p').select()}});
</script></body></html>
